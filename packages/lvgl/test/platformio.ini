; Host tests of lv_qrkude against several LVGL releases.
; Copyright 2026 The QRKude Authors
; SPDX-License-Identifier: Apache-2.0
;
;   pio run -d packages/lvgl/test                 # build all environments
;   .pio/build/<env>/program OUT_DIR              # render + manifest
;   python packages/arduino/test/native/check_decode.py OUT_DIR
;
; lv_qrkude.c and the QRKude core are compiled in place from the monorepo
; by monorepo_sources.py.

[env]
platform = native
build_flags =
    -std=gnu11
    -Wall
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
    -I ..
    -I ../../../core/include
    -DLV_QRKUDE_MAX_VERSION=10
    -lm
extra_scripts = pre:monorepo_sources.py
lib_compat_mode = off

[env:lvgl96_rgb565]
lib_deps = lvgl/lvgl@9.6.0
build_flags = ${env.build_flags} -DLV_TEST_COLOR_FORMAT=LV_COLOR_FORMAT_RGB565

[env:lvgl96_xrgb8888]
lib_deps = lvgl/lvgl@9.6.0
build_flags = ${env.build_flags} -DLV_TEST_COLOR_FORMAT=LV_COLOR_FORMAT_XRGB8888

[env:lvgl96_l8]
lib_deps = lvgl/lvgl@9.6.0
build_flags = ${env.build_flags} -DLV_TEST_COLOR_FORMAT=LV_COLOR_FORMAT_L8

[env:lvgl92_rgb565]
lib_deps = lvgl/lvgl@9.2.2

[env:lvgl90_rgb565]
lib_deps = lvgl/lvgl@9.0.0

[env:lvgl83_rgb565]
lib_deps = lvgl/lvgl@8.3.11

[env:lvgl83_rgb565_swap]
lib_deps = lvgl/lvgl@8.3.11
build_flags = ${env.build_flags} -DLV_COLOR_16_SWAP=1

[env:lvgl83_xrgb8888]
lib_deps = lvgl/lvgl@8.3.11
build_flags = ${env.build_flags} -DLV_COLOR_DEPTH=32
