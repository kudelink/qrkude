; PlatformIO build of the ESP-IDF example (idf.py works as well).
; Copyright 2026 The QRKude Authors
; SPDX-License-Identifier: Apache-2.0
[platformio]
src_dir = main

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200

; Same, with the ST7789 drawing code enabled (sdkconfig.lcd).
[env:esp32dev_lcd]
extends = env:esp32dev
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.lcd"
