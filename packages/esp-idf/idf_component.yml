# QRKude - ESP-IDF Component Manager manifest
# Copyright 2026 The QRKude Authors
# SPDX-License-Identifier: Apache-2.0
version: "0.1.0"
description: >-
  Styled QR codes for ESP32: dot, fluid, liquid and bar modules, custom eyes,
  gradients, logos and labels. Streams SVG, renders RGB565/RGB888/gray/mono
  pixels or spans, optional LVGL widget. No malloc.
url: "https://kudelink.com"
repository: "https://github.com/kudelink/qrkude.git"
license: "Apache-2.0"
tags:
  - qrcode
  - qr-code
  - svg
  - display
  - lvgl
dependencies:
  idf: ">=4.4"
examples:
  - path: examples/basic
files:
  exclude:
    - "**/build/**"
    - "**/.pio/**"
    - "**/sdkconfig"
    - "**/sdkconfig.old"
